[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livestock-weight-api"
version = "0.1.0"
description = "Local companion API for livestock-weight (SQLite + Firestore sync stubs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]
# Optional Google client — not required for local mock; install when wiring real sync
firestore = [
  "google-cloud-firestore>=2.16,<3",
  "firebase-admin>=6.5,<7",
]

[project.scripts]
livestock-weight-api = "livestock_weight_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
