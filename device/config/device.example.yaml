# Example edge config for BoviScan (copy to device.yaml)
species_default: cattle
pipeline_interval_s: 0.2

camera:
  backend: mock          # mock | picamera2
  height_m: 3.0
  fov_horizontal_deg: 66.0
  width: 1280
  height: 720
  fps: 15

inference:
  backend: cpu_mock      # hailo | cpu_mock | mock
  # Hailo production (Phase 3): set backend: hailo and point at a local HEF
  hef_path: null         # e.g. /opt/livestock-weight/models/detect.hef
  model_path: null       # legacy alias for hef_path
  batch: 1
  input_size: [640, 640, 3]   # W, H, C — expected HEF input tensor
  confidence_threshold: 0.4
  postprocess: passthrough    # passthrough | yolo_nms | none
  # postprocess_hooks: [yolo_nms]  # optional list form; first entry used
  fallback_to_cpu: true       # graceful fallback when SDK/HEF missing
  labels: [livestock]

api:
  base_url: http://127.0.0.1:8000
  device_id: device-local-01
# Set LW_POST_API=true or pass --post-api to POST WeightEvents to api.base_url
# LW_HEF_PATH overrides inference.hef_path

# LAN discovery (UDP beacon; mDNS documented in docs/DISCOVERY.md)
# LW_DISCOVERY_BEACON=true (default) · LW_DISCOVERY_PORT=45454
# discovery:
#   enabled: true
#   port: 45454
#   interval_s: 5

# OTA stubs (docs/OTA.md) — safe no-op without LW_OTA_MANIFEST_URL
# LW_OTA_CHECK=true to print check_for_update status on start
